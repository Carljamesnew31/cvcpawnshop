<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVCPawnshop</title>
<style>
  :root {
    --blue-900: #0a1f44;
    --blue-700: #1e3a8a;
    --blue-500: #2563eb;
    --blue-300: #60a5fa;
    --blue-100: #dbeafe;
    --accent: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 50%, #93c5fd 100%); color: #1f2937; min-height: 100vh; }
  .topbar { background: linear-gradient(90deg, var(--blue-900), var(--blue-700)); padding: 10px 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.2); display: flex; align-items: center; justify-content: space-between; }
  .menu-btn { background: none; border: none; color: white; font-size: 26px; cursor: pointer; padding: 4px 8px; }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo img { height: 40px; width: auto; border-radius: 6px; background: white; padding: 2px; }
  .logo span { color: white; font-size: 18px; font-weight: 700; }
  .sidebar { position: fixed; top: 0; left: -260px; width: 240px; height: 100%; background: var(--blue-900); padding: 60px 16px 16px; transition: left .25s; z-index: 200; box-shadow: 2px 0 12px rgba(0,0,0,.3); }
  .sidebar.open { left: 0; }
  .sidebar a { display: block; color: white; text-decoration: none; padding: 12px 14px; border-radius: 8px; font-weight: 600; margin-bottom: 6px; transition: background .2s; }
  .sidebar a:hover { background: rgba(255,255,255,.12); }
  .sidebar a.btn { background: var(--accent); color: #1f2937; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 150; display: none; }
  .overlay.show { display: block; }
  .container { max-width: 1100px; margin: 16px auto; padding: 0 16px; }
  .card { background: rgba(255,255,255,.95); padding: 20px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.3); margin-bottom: 20px; color: #1f2937; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: left; font-size: 14px; }
  th { background: var(--blue-700); color: white; }
  tr:hover { background: var(--blue-100); }
  button, input[type=submit], .btn-action { background: var(--blue-500); color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: transform .1s, background .2s; display: inline-block; text-decoration: none; }
  button:hover, input[type=submit]:hover, .btn-action:hover { background: var(--blue-700); transform: translateY(-1px); }
  button.danger { background: #dc2626; }
  input, select, textarea { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; width: 100%; box-sizing: border-box; margin: 6px 0; font-size: 14px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue-500); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  img { max-width: 100%; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .item { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.4); transition: transform .2s; color: #1f2937; }
  .item:hover { transform: translateY(-4px); }
  .item img { height: 160px; object-fit: cover; width: 100%; }
  .item .info { padding: 12px; color: #1f2937; }
  .item h3 { color: #1e3a8a; }
  h2 { color: #1e3a8a; }
  .price { color: var(--blue-700); font-weight: 700; font-size: 18px; }
  .hero { background: linear-gradient(135deg, var(--blue-700), var(--blue-500)); color: white; padding: 40px 24px; border-radius: 16px; text-align: center; margin-bottom: 24px; box-shadow: 0 8px 24px rgba(30,58,138,.25); }
  .hero h1 { color: white; font-size: 32px; margin-bottom: 8px; }
  .hero p { color: #dbeafe; margin-bottom: 16px; }
  .hero .btn-action { background: var(--accent); color: #1f2937; }
  footer { text-align: center; padding: 20px; color: #64748b; font-size: 13px; }
  h1, h2, h3 { color: var(--blue-900); }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } table { font-size: 12px; } th, td { padding: 6px; } }
</style>
</head>
<body>
<div class="topbar">
  <button class="menu-btn" onclick="toggleMenu()" aria-label="Menu">&#9776;</button>
  <div class="logo">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" onerror="this.style.display='none'">
    <span>CVCPawnshop</span>
  </div>
</div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar">
  <a href="{{ url_for('home') }}">Home</a>
  <a href="{{ url_for('remate') }}">Remate</a>
  <a href="{{ url_for('contact') }}">Contact</a>
  {% if session.get('admin') %}
    <a href="{{ url_for('admin') }}" class="btn">Admin</a>
    <a href="{{ url_for('logout') }}">Logout</a>
  {% else %}
    <a href="{{ url_for('login') }}" class="btn">Admin Login</a>
  {% endif %}
</div>
<div class="container">
  {% block content %}{% endblock %}
</div>
<footer>CVCPawnshop &copy; 2026 &mdash; Trusted Pawnshop</footer>
<div id="imgModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;align-items:center;justify-content:center;padding:20px;" onclick="closeModal()">
  <div style="background:white;border-radius:12px;max-width:500px;width:100%;overflow:hidden;" onclick="event.stopPropagation()">
    <img id="modalImg" src="" style="width:100%;height:280px;object-fit:cover;">
    <div style="padding:16px;">
      <h3 id="modalName"></h3>
      <p id="modalDesc"></p>
      <p class="price" id="modalPrice"></p>
      <button onclick="closeModal()" style="margin-top:10px;">Close</button>
    </div>
  </div>
</div>
<script>
function toggleMenu(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); }
function openModal(src,name,price,desc){ document.getElementById('modalImg').src=src; document.getElementById('modalName').textContent=name; document.getElementById('modalDesc').textContent=desc; document.getElementById('modalPrice').textContent='₱'+price; document.getElementById('imgModal').style.display='flex'; }
function closeModal(){ document.getElementById('imgModal').style.display='none'; }
</script>
</body>
</html>
